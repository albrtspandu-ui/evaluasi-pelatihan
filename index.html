<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Report Evaluasi Pelatihan – MDS Retailing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Mulish:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
/* =========================================================
   KONFIGURASI WARNA UI (bukan warna report – report selalu putih)
   ========================================================= */
:root{
  color-scheme: light;
  --bg:#E9ECF2;
  --panel:#FFFFFF;
  --ink:#141A2B;
  --muted:#5B6478;
  --line:#D5DAE4;
  --navy:#0B2265;
  --navy-soft:#E3E8F5;
  --amber:#9A5B00;
  --amber-soft:#FDF1DC;
  --danger:#A3122A;
  --danger-soft:#FBE4E8;
  --ok:#156B3F;
  --ok-soft:#E1F3E8;
  --field:#F7F8FB;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#10131B; --panel:#1A1F2B; --ink:#E7EAF1; --muted:#9AA3B6; --line:#2E3546;
    --navy:#8FA8F0; --navy-soft:#1F2A47; --amber:#F2B862; --amber-soft:#3A2C14;
    --danger:#F28B9C; --danger-soft:#3D1A22; --ok:#7FD3A3; --ok-soft:#173326; --field:#141822;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#10131B; --panel:#1A1F2B; --ink:#E7EAF1; --muted:#9AA3B6; --line:#2E3546;
  --navy:#8FA8F0; --navy-soft:#1F2A47; --amber:#F2B862; --amber-soft:#3A2C14;
  --danger:#F28B9C; --danger-soft:#3D1A22; --ok:#7FD3A3; --ok-soft:#173326; --field:#141822;
}
:root{ box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
html{ scroll-padding-top:env(safe-area-inset-top,0px); }
*,*::before,*::after{ box-sizing:inherit; }
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Plus Jakarta Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  font-size:15px; line-height:1.5;
}
button,input,textarea{ font:inherit; color:inherit; }
:focus-visible{ outline:2px solid var(--navy); outline-offset:2px; }

/* ---------- Header ---------- */
.app-head{
  display:flex; align-items:center; gap:18px; padding:18px 28px;
  border-bottom:1px solid var(--line); background:var(--panel);
}
.app-head h1{ margin:0; font-size:19px; font-weight:700; letter-spacing:-0.01em; }
.app-head p{ margin:0; color:var(--muted); font-size:13.5px; }

/* ---------- Layout ---------- */
.layout{
  display:grid; grid-template-columns:minmax(360px, 470px) 1fr; gap:28px;
  padding:28px; max-width:1500px; margin:0 auto; align-items:start;
}
@media (max-width: 980px){ .layout{ grid-template-columns:1fr; padding:16px; gap:20px; } }

.steps{ display:flex; flex-direction:column; gap:18px; min-width:0; }
.step{ background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:20px 22px 22px; }
.step-head{ display:flex; align-items:baseline; gap:12px; margin-bottom:14px; }
.step-num{
  flex:none; width:26px; height:26px; border-radius:50%; display:grid; place-items:center;
  background:var(--navy); color:var(--panel); font-size:13px; font-weight:700;
}
.step-head h2{ margin:0; font-size:16px; font-weight:700; }
.step-head .hint{ color:var(--muted); font-size:13px; margin-left:auto; }
.step.locked{ opacity:.55; }
.step.locked .step-body{ pointer-events:none; }

/* ---------- Upload ---------- */
.drop{
  display:block; border:1.5px dashed var(--line); border-radius:10px; padding:22px; text-align:center;
  cursor:pointer; background:var(--field); transition:border-color .15s, background .15s;
}
.drop:hover,.drop.drag{ border-color:var(--navy); background:var(--navy-soft); }
.drop strong{ display:block; font-size:15px; }
.drop span{ color:var(--muted); font-size:13px; }
.drop input{ position:absolute; width:1px; height:1px; opacity:0; }
.file-info{ margin-top:14px; font-size:13.5px; }
.file-info .fname{ font-weight:600; word-break:break-all; }
.stats{ display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
.chip{ font-size:12.5px; padding:4px 10px; border-radius:999px; background:var(--navy-soft); color:var(--navy); font-weight:600; }
.chip.warn{ background:var(--amber-soft); color:var(--amber); }
.notice{ margin-top:10px; padding:10px 12px; border-radius:8px; font-size:13px; }
.notice.err{ background:var(--danger-soft); color:var(--danger); }
.notice.warn{ background:var(--amber-soft); color:var(--amber); }
.notice.ok{ background:var(--ok-soft); color:var(--ok); }

/* ---------- Fields ---------- */
.field{ display:flex; flex-direction:column; gap:5px; margin-bottom:12px; }
.field:last-child{ margin-bottom:0; }
.field label{ font-size:13px; font-weight:600; }
.field .sub{ font-size:12px; color:var(--muted); font-weight:400; }
.field input[type=text], .field textarea{
  width:100%; border:1px solid var(--line); background:var(--field); border-radius:8px; padding:9px 11px;
}
.field textarea{ resize:vertical; min-height:64px; overflow:hidden; line-height:1.45; font-size:14px; }
.row2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.date-row{ display:flex; gap:8px; }
.date-row input[type=text]{ flex:1; }
.date-row input[type=date]{
  flex:none; width:150px; border:1px solid var(--line); background:var(--field); border-radius:8px; padding:0 8px; cursor:pointer;
}

/* ---------- Summary editor ---------- */
.ai-bar{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:6px; }
.ai-status{ font-size:13px; color:var(--muted); }
.sum-group{ border-top:1px solid var(--line); padding-top:14px; margin-top:14px; }
.sum-group h3{ margin:0 0 10px; font-size:14.5px; font-weight:700; display:flex; align-items:baseline; gap:8px; }
.sum-group h3 .avg{ font-weight:600; color:var(--muted); font-size:13px; }
.field.improve label{ color:var(--amber); }
details.raw{ margin-top:4px; font-size:13px; }
details.raw summary{ cursor:pointer; color:var(--navy); font-weight:600; padding:4px 0; }
details.raw ul{ margin:6px 0 0; padding-left:18px; color:var(--muted); max-height:220px; overflow:auto; }
details.raw li{ margin-bottom:3px; }
details.raw .tools{ margin-top:6px; }
.sec-tools{ display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin:2px 0 6px; }
.sec-status{ font-size:12.5px; color:var(--muted); }
.ai-mode{ margin:4px 0 0; font-size:12.5px; color:var(--muted); }

/* ---------- Buttons ---------- */
.btn{
  border:1px solid var(--navy); background:var(--navy); color:var(--panel); border-radius:9px;
  padding:9px 16px; font-weight:600; font-size:14px; cursor:pointer; display:inline-flex; align-items:center; gap:8px;
}
.btn:hover{ filter:brightness(1.08); }
.btn:disabled{ opacity:.5; cursor:not-allowed; filter:none; }
.btn.ghost{ background:transparent; color:var(--navy); }
.btn.small{ padding:5px 10px; font-size:12.5px; border-radius:7px; }
.spin{ width:14px; height:14px; border:2px solid currentColor; border-right-color:transparent; border-radius:50%; animation:spin .7s linear infinite; }
@keyframes spin{ to{ transform:rotate(360deg); } }
@media (prefers-reduced-motion: reduce){ .spin{ animation-duration:2s; } }

/* ---------- Preview ---------- */
.preview-col{ position:sticky; top:16px; min-width:0; }
@media (max-width: 980px){ .preview-col{ position:static; } }
.preview-bar{ display:flex; align-items:center; gap:12px; margin-bottom:12px; flex-wrap:wrap; }
.preview-bar .fit{ font-size:13px; color:var(--muted); }
.preview-bar .fit.over{ color:var(--danger); font-weight:600; }
.preview-bar .btn{ margin-left:auto; }
.sheet-frame{ width:100%; overflow:hidden; }
.sheet-scaler{ transform-origin:top left; width:794px; }
.sheet-shadow{ box-shadow:0 1px 3px rgba(20,26,43,.12), 0 12px 32px rgba(20,26,43,.14); }

/* =========================================================
   REPORT A4 (794 x 1123 px @96dpi). Selalu putih, tidak ikut dark mode.
   --k = faktor skala otomatis agar konten muat 1 halaman.
   ========================================================= */
.page{
  --k:1; --kc:1;
  --navy-bar:#0B2160;
  width:794px; height:1123px; background:#fff; color:#000;
  padding:48px 80px 40px; display:flex; flex-direction:column;
  font-family:"Century Gothic", "Mulish", "Avenir", Arial, sans-serif;
  position:relative; overflow:hidden;
}
.page *{ box-sizing:border-box; }
.r-body{ flex:1; min-height:0; overflow:hidden; }
.r-logo img{ height:24px; display:block; }
.r-title{ text-align:center; font-family:Arial, Helvetica, sans-serif; font-weight:700; font-size:calc(13.5px * var(--k)); line-height:1.35; margin-top:calc(18px * var(--k)); }
.r-title .t2{ font-size:calc(14px * var(--k)); }
.r-info{ margin-top:calc(16px * var(--k)); border-collapse:collapse; font-weight:700; font-size:calc(13px * var(--k)); }
.r-info td{ padding:0 0 1px; vertical-align:top; line-height:1.3; }
.r-info td:first-child{ width:150px; white-space:nowrap; }
.r-legend{ margin-top:calc(14px * var(--k)); font-family:Arial, Helvetica, sans-serif; font-size:calc(9px * var(--k)); font-weight:700; }
.r-legend .lbl{ padding-left:10px; margin-bottom:3px; }
.r-legend .band{ background:#A6A6A6; display:flex; justify-content:center; gap:22px; padding:3px 0; }
.r-h{ margin-top:calc(14px * var(--k)); font-weight:700; text-decoration:underline; text-underline-offset:2px; font-size:calc(12.5px * var(--k)); }

.chart{ border:1px solid #D9D9D9; margin-top:calc(6px * var(--k)); padding:calc(8px * var(--kc)) 14px calc(6px * var(--kc)); font-family:Arial, Helvetica, sans-serif; }
.chart-title{ text-align:center; color:#595959; font-size:calc(16px * (0.5 + var(--kc) / 2)); margin-bottom:calc(6px * var(--kc)); }
.plot{ position:relative; height:calc(128px * var(--kc)); margin-left:28px; margin-right:34px; }
.grid{ position:absolute; left:0; right:0; height:0; border-top:1px dashed #D9D9D9; }
.grid.max{ border-top:1.5px solid #7F7F7F; }
.grid span{ position:absolute; left:-28px; width:22px; top:calc(-5px * var(--k)); text-align:right; font-size:calc(7.5px * var(--k)); color:#7F7F7F; line-height:1; }
.grid.max span{ color:#000; font-weight:700; }
.bars{ position:absolute; inset:0; display:flex; border-bottom:1px solid #BFBFBF; }
.slot{ flex:1; height:100%; display:flex; justify-content:center; }
.track{ width:62%; height:100%; background:#C9D6EE; display:flex; flex-direction:column; justify-content:flex-end; }
.bars.few .track{ width:42%; }
.fill{ background:var(--navy-bar); position:relative; }
.fill span{ position:absolute; left:0; right:0; top:calc(5px * var(--k)); text-align:center; color:#fff; font-weight:700; font-size:calc(8.5px * var(--k)); line-height:1; }
.fill.low span{ top:auto; bottom:100%; margin-bottom:2px; color:var(--navy-bar); }
.avgline{ position:absolute; left:0; right:-34px; height:0; border-top:2px solid #A6A6A6; }
.avgline span{ position:absolute; right:0; top:3px; font-weight:700; font-size:calc(8.5px * var(--k)); color:#000; line-height:1; }
.cats{ display:flex; margin-left:28px; margin-right:34px; margin-top:4px; }
.cats div{ flex:1; text-align:center; color:#595959; font-size:calc(7.5px * var(--k)); line-height:1.25; padding:0 4px; }
.legend{ display:flex; justify-content:center; gap:16px; font-size:calc(7.5px * var(--k)); color:#595959; margin-top:calc(5px * var(--kc)); }
.legend i{ display:inline-block; width:8px; height:8px; margin-right:4px; vertical-align:-1px; }
.r-avg{ text-align:center; font-weight:700; font-size:calc(9.5px * var(--k)); margin-top:calc(8px * var(--k)); }
.r-text{ font-size:calc(9.5px * var(--k)); line-height:1.4; margin-top:calc(5px * var(--k)); }
.r-text p{ margin:0; padding-left:8px; text-indent:-8px; }
.r-text .sublbl{ font-weight:700; font-style:italic; margin-top:calc(3px * var(--k)); padding-left:0; text-indent:0; }
.r-know-h{ font-weight:700; font-size:calc(9.5px * var(--k)); margin-top:calc(12px * var(--k)); }
.r-text.know{ margin-top:calc(8px * var(--k)); }
.r-placeholder{ color:#9A9A9A; font-style:italic; }
.r-foot{ flex:none; margin-top:10px; background:#A6A6A6; text-align:center; font-size:9px; padding:5px 10px; line-height:1.45; }
.r-foot b{ display:block; }
.r-empty{ display:flex; align-items:center; justify-content:center; height:100%; color:#999; font-size:15px; text-align:center; padding:40px; }

.sr-only{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
</style>
</head>
<body>

<header class="app-head">
  <div>
    <h1>Report Evaluasi Pelatihan</h1>
    <p>Unggah hasil kuesioner, lengkapi keterangan kelas, periksa rangkuman, lalu unduh PDF satu halaman.</p>
  </div>
</header>

<main class="layout">
  <section class="steps" aria-label="Langkah penyusunan report">

    <!-- STEP 1 -->
    <div class="step" id="step1">
      <div class="step-head"><div class="step-num">1</div><h2>Data kuesioner</h2></div>
      <div class="step-body">
        <label class="drop" id="drop">
          <input type="file" id="fileInput" accept=".xlsx,.xls,.csv">
          <strong>Pilih file Excel</strong>
          <span>atau tarik file ke sini (.xlsx hasil ekspor form)</span>
        </label>
        <div id="fileInfo" class="file-info" hidden></div>
      </div>
    </div>

    <!-- STEP 2 -->
    <div class="step" id="step2">
      <div class="step-head"><div class="step-num">2</div><h2>Keterangan pelatihan</h2></div>
      <div class="step-body">
        <div class="field">
          <label for="fProgram">Program</label>
          <input type="text" id="fProgram" placeholder="Nama Program">
        </div>
        <div class="field">
          <label for="fJudul">Materi</label>
          <input type="text" id="fJudul" placeholder="Nama Materi">
        </div>
        <div class="field">
          <label for="fTanggal">Hari, tanggal <span class="sub">— pilih dari kalender atau ketik sendiri</span></label>
          <div class="date-row">
            <input type="text" id="fTanggal" placeholder="Hari, Tanggal">
            <input type="date" id="fDatePick" aria-label="Pilih tanggal dari kalender" title="Pilih dari kalender">
          </div>
        </div>
        <div class="field">
          <label for="fDurasi">Durasi</label>
          <input type="text" id="fDurasi" placeholder="8 Jam">
        </div>
        <div class="field">
          <label for="fTrainer">Fasilitator</label>
          <input type="text" id="fTrainer" placeholder="Nama Fasilitator">
        </div>
        <div class="field">
          <label for="fCoord">Training Coordinator</label>
          <input type="text" id="fCoord" placeholder="Nama Training Coordinator">
        </div>
      </div>
    </div>

    <!-- STEP 3 -->
    <div class="step locked" id="step3">
      <div class="step-head"><div class="step-num">3</div><h2>Rangkuman masukan</h2><span class="hint">satu poin per baris</span></div>
      <div class="step-body">
        <div class="ai-bar">
          <button class="btn" id="btnAI" type="button" disabled>Rapikan semua</button>
          <span class="ai-status" id="aiStatus">Unggah data dulu.</span>
        </div>
        <p class="ai-mode" id="aiMode">Memeriksa ketersediaan ringkasan AI…</p>
        <div id="aiNotice"></div>
        <div id="sumEditors"></div>
      </div>
    </div>

  </section>

  <section class="preview-col" aria-label="Pratinjau report">
    <div class="preview-bar">
      <span class="fit" id="fitStatus">Pratinjau A4</span>
      <button class="btn" id="btnPDF" type="button" disabled>Unduh PDF</button>
    </div>
    <div class="sheet-frame" id="sheetFrame">
      <div class="sheet-scaler" id="sheetScaler">
        <div class="sheet-shadow"><div class="page" id="page"></div></div>
      </div>
    </div>
  </section>
</main>

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const norm = (s) => String(s ?? "").replace(/\u00a0/g," ").replace(/\s+/g," ").trim().toLowerCase();

/* Pembulatan setengah ke atas, aman dari galat floating point (4.925 -> 4.93) */
function round2(x){ return Math.round(Number((x * 100).toFixed(6))) / 100; }
function fmt2(x){ return round2(x).toFixed(2); }

/* =========================================================
   PARSING EXCEL
   ========================================================= */
function parseWorkbook(buf){
  const wb = XLSX.read(buf, { type:"array", cellDates:true });
  const ws = wb.Sheets[wb.SheetNames[0]];
  const rows = XLSX.utils.sheet_to_json(ws, { header:1, defval:null, raw:true, blankrows:false });
  if (!rows.length) throw new Error("Sheet pertama kosong.");

  const header = rows[0] || [];
  const warnings = [];

  // Cek judul kolom agar tidak salah baca bila urutan kolom berubah
  const mismatched = [];
  SECTIONS.forEach(s => s.items.forEach(it => {
    if (!norm(header[it.col]).startsWith(it.header)) mismatched.push(XLSX.utils.encode_col(it.col));
  }));
  Object.entries(COMMENT_HEADERS).forEach(([c, h]) => {
    if (!norm(header[c]).includes(h)) mismatched.push(XLSX.utils.encode_col(Number(c)));
  });
  if (mismatched.length > 6) {
    throw new Error("Susunan kolom tidak sesuai format kuesioner evaluasi (kolom J–X). Pastikan file yang diunggah adalah hasil ekspor form evaluasi.");
  }
  if (mismatched.length) warnings.push("Judul kolom " + mismatched.join(", ") + " berbeda dari format biasa. Periksa kembali hasil hitungnya.");

  const respondents = [];
  let mergedRows = 0, invalidScores = 0;
  const isEmpty = (v) => v === null || v === undefined || String(v).trim() === "";

  for (let i = 1; i < rows.length; i++){
    const row = rows[i] || [];
    if (!row.some(v => !isEmpty(v))) continue;

    if (!isEmpty(row[0])) {
      const r = { id: row[0], scores:{}, comments:{} };
      SECTIONS.forEach(s => s.items.forEach(it => {
        const v = row[it.col];
        if (isEmpty(v)) return;
        const n = Number(v);
        if (Number.isFinite(n) && n >= 1 && n <= 5) r.scores[it.col] = n;
        else invalidScores++;
      }));
      [20,21,22,23].forEach(c => { if (!isEmpty(row[c])) r.comments[c] = String(row[c]).trim(); });
      respondents.push(r);
    } else if (respondents.length) {
      // Baris lanjutan (jawaban yang terpecah ke baris baru) -> gabungkan ke responden sebelumnya
      const prev = respondents[respondents.length - 1];
      let used = false;
      [20,21,22,23].forEach(c => {
        if (!isEmpty(row[c])) {
          const add = String(row[c]).trim();
          prev.comments[c] = prev.comments[c] ? prev.comments[c] + "; " + add : add;
          used = true;
        }
      });
      if (used) mergedRows++;
    }
  }
  if (!respondents.length) throw new Error("Tidak ada baris jawaban yang memiliki Id.");
  if (invalidScores) warnings.push(invalidScores + " nilai di luar rentang 1–5 diabaikan.");

  // Rata-rata per item, lalu rata-rata kelompok = rata-rata dari rata-rata item
  const results = SECTIONS.map(s => {
    const items = s.items.map(it => {
      const vals = respondents.map(r => r.scores[it.col]).filter(v => v !== undefined);
      const avg = vals.length ? vals.reduce((a,b) => a + b, 0) / vals.length : 0;
      return { label: it.label, avg, n: vals.length };
    });
    const groupAvg = items.reduce((a,b) => a + b.avg, 0) / items.length;
    const comments = respondents.map(r => r.comments[s.commentCol]).filter(Boolean);
    return { key:s.key, name:s.name, title:s.title, items, groupAvg, comments };
  });
  const knowledge = respondents.map(r => r.comments[KNOW_COL]).filter(Boolean);

  return { respondents: respondents.length, mergedRows, warnings, results, knowledge };
}

/* =========================================================

   ========================================================= */
const fileInput = $("fileInput"), drop = $("drop");
fileInput.addEventListener("change", e => { if (e.target.files[0]) handleFile(e.target.files[0]); });
["dragenter","dragover"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add("drag"); }));
["dragleave","drop"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove("drag"); }));
drop.addEventListener("drop", e => { const f = e.dataTransfer.files[0]; if (f) handleFile(f); });

async function handleFile(file){
  const info = $("fileInfo");
  info.hidden = false;
  try {
    if (typeof XLSX === "undefined") throw new Error("Pustaka pembaca Excel gagal dimuat. Periksa koneksi internet lalu muat ulang halaman.");
    const buf = await file.arrayBuffer();
    const data = parseWorkbook(buf);
    state.data = data;
    state.summary = { A:{pos:"",imp:""}, B:{pos:"",imp:""}, C:{pos:"",imp:""}, know:"" };

    const totalComments = data.results.reduce((a,r) => a + r.comments.length, 0) + data.knowledge.length;
    info.innerHTML =
      '<div class="fname">' + esc(file.name) + '</div>' +
      '<div class="stats">' +
        '<span class="chip">' + data.respondents + ' responden</span>' +
        '<span class="chip">' + totalComments + ' komentar</span>' +
        (data.mergedRows ? '<span class="chip warn">' + data.mergedRows + ' baris lanjutan digabung</span>' : '') +
      '</div>' +
      data.warnings.map(w => '<div class="notice warn">' + esc(w) + '</div>').join("");

    $("step3").classList.remove("locked");
    $("btnAI").disabled = false;
    $("btnPDF").disabled = false;
    $("aiStatus").textContent = "Isi rangkuman per bagian, atau sekaligus dengan tombol ini.";
    $("aiNotice").innerHTML = "";
    buildEditors();
    render();
  } catch (err) {
    state.data = null;
    info.innerHTML = '<div class="fname">' + esc(file.name) + '</div><div class="notice err">' + esc(err.message || err) + '</div>';
    $("step3").classList.add("locked");
    $("btnAI").disabled = true;
    $("btnPDF").disabled = true;
    $("sumEditors").innerHTML = "";
    render();
  } finally {
    fileInput.value = "";
  }
}

});

/* =========================================================
   EDITOR RANGKUMAN
   ========================================================= */
function uniqueComments(list){
  const map = new Map();
  list.forEach(c => { const k = norm(c); if (!k) return; map.set(k, { text:c, n:(map.get(k)?.n || 0) + 1 }); });
  return [...map.values()];
}
const TRIVIAL = /^(ok(e|ay)?|oke+|good|bagus|baik|mantap|sip|sudah (sangat )?(bagus|baik|oke|ok|jelas)( bgt| banget| sekali)?|sangat bagus|cukup|tidak ada|-|nihil|none)[.!\s]*$/i;

function rawList(list){
  const u = uniqueComments(list);
  if (!u.length) return '<p style="color:var(--muted);margin:6px 0 0">Tidak ada komentar.</p>';
  return '<ul>' + u.map(c => '<li>' + esc(c.text) + (c.n > 1 ? ' <b>(' + c.n + '×)</b>' : '') + '</li>').join("") + '</ul>';
}

function buildEditors(){
  const d = state.data; if (!d) return;
  const tools = (key, copyLabel) =>
    '<div class="sec-tools">' +
      '<button type="button" class="btn ghost small" data-tidy="' + key + '" title="Tanpa AI: buang komentar generik & duplikat, rapikan singkatan dan tanda baca">Rapikan</button>' +
      (state.aiAvailable ? '<button type="button" class="btn ghost small" data-ai="' + key + '">Ringkas dengan AI</button>' : '') +
      '<button type="button" class="btn ghost small" data-copy="' + key + '">' + copyLabel + '</button>' +
      '<span class="sec-status" id="st' + key + '"></span>' +
    '</div>';
  let html = "";
  d.results.forEach(r => {
    html +=
      '<div class="sum-group">' +
        '<h3>' + esc(r.title) + ' <span class="avg">rata-rata ' + fmt2(r.groupAvg) + '</span></h3>' +
        '<div class="field"><label for="pos' + r.key + '">Kesan umum</label>' +
          '<textarea id="pos' + r.key + '" data-k="' + r.key + '" data-t="pos" rows="2"></textarea></div>' +
        '<div class="field improve"><label for="imp' + r.key + '">Masukan perbaikan <span class="sub">— kosongkan bila tidak ada</span></label>' +
          '<textarea id="imp' + r.key + '" data-k="' + r.key + '" data-t="imp" rows="2"></textarea></div>' +
        tools(r.key, "Salin mentah") +
        '<details class="raw"><summary>Lihat ' + r.comments.length + ' komentar peserta</summary>' + rawList(r.comments) + '</details>' +
      '</div>';
  });
  html +=
    '<div class="sum-group">' +
      '<h3>Pengetahuan / wawasan peserta</h3>' +
      '<div class="field"><label for="know">Poin wawasan</label><textarea id="know" data-k="know" rows="4"></textarea></div>' +
      tools("know", "Salin mentah") +
      '<details class="raw"><summary>Lihat ' + d.knowledge.length + ' jawaban peserta</summary>' + rawList(d.knowledge) + '</details>' +
    '</div>';
  $("sumEditors").innerHTML = html;

  $("sumEditors").querySelectorAll("textarea").forEach(t => {
    t.addEventListener("input", () => {
      autosize(t);
      if (t.dataset.k === "know") state.summary.know = t.value;
      else state.summary[t.dataset.k][t.dataset.t] = t.value;
      render();
    });
  });
  $("sumEditors").querySelectorAll("[data-copy]").forEach(b => b.addEventListener("click", () => copyComments(b.dataset.copy)));
  $("sumEditors").querySelectorAll("[data-tidy]").forEach(b => b.addEventListener("click", () => tidySection(b.dataset.tidy)));
  $("sumEditors").querySelectorAll("[data-ai]").forEach(b => b.addEventListener("click", () => summarizeSection(b.dataset.ai, b)));
}

function autosize(t){ t.style.height = "auto"; t.style.height = (t.scrollHeight + 2) + "px"; }
function setEditorValues(){
  ["A","B","C"].forEach(k => { $("pos"+k).value = state.summary[k].pos; $("imp"+k).value = state.summary[k].imp; });
  $("know").value = state.summary.know;
  $("sumEditors").querySelectorAll("textarea").forEach(autosize);
}
function sectionFilled(key){
  return key === "know" ? !!state.summary.know.trim() : !!(state.summary[key].pos.trim() || state.summary[key].imp.trim());
}
const listFor = (key) => key === "know" ? state.data.knowledge : state.data.results.find(x => x.key === key).comments;

/* Salin komentar mentah (tanpa komentar generik & duplikat) ke kolom edit */
function copyComments(key){
  const lines = uniqueComments(listFor(key)).map(c => c.text).filter(t => !TRIVIAL.test(t.trim()));
  const ta = key === "know" ? $("know") : $("imp" + key);
  if (!lines.length) { $("st" + key).textContent = "Tidak ada komentar yang bisa disalin."; return; }
  ta.value = (ta.value.trim() ? ta.value.trim() + "\n" : "") + lines.join("\n");
  autosize(ta);
  if (key === "know") state.summary.know = ta.value; else state.summary[key].imp = ta.value;
  $("st" + key).textContent = lines.length + " komentar disalin.";
  render();
}

/* =========================================================
   RAPIKAN (TANPA AI) – berjalan sepenuhnya di browser
   ========================================================= */
const ABBR = {
  lbh:"lebih", utk:"untuk", untk:"untuk", org:"orang", yg:"yang", dgn:"dengan", dg:"dengan", krn:"karena", karna:"karena",
  tdk:"tidak", gak:"tidak", ga:"tidak", nggak:"tidak", sdh:"sudah", udah:"sudah", blm:"belum", jg:"juga", dr:"dari",
  pd:"pada", spy:"supaya", tsb:"tersebut", kpd:"kepada", bs:"bisa", tp:"tetapi", msh:"masih", bgt:"sekali", banget:"sekali",
  jadul:"lama", kmrn:"kemarin", trs:"terus", sm:"sama", dlm:"dalam", thd:"terhadap", eq:"EQ", iq:"IQ"
};
function tidyText(s){
  let t = String(s).replace(/\s+/g, " ").trim();
  t = t.replace(/[A-Za-z]+/g, w => ABBR[w.toLowerCase()] ?? w);
  t = t.replace(/^(bahwa|yaitu|yakni)\s+/i, "");
  t = t.replace(/\bdi ([a-z]+kan)\b/gi, "di$1");
  t = t.replace(/\s*,\s*/g, ", ").replace(/\s+([.!?])/g, "$1");
  t = t.charAt(0).toUpperCase() + t.slice(1);
  if (!/[.!?]$/.test(t)) t += ".";
  return t;
}
const SUGGEST = /\b(lebih|tambah|penambahan|ditambah|mohon|sebaiknya|perlu|agar|supaya|update|diperbarui|kurang|durasi|waktu|jadwal|diadakan|adakan|ditunggu|semoga|harap|saran|bisa sedikit|sering)\b/i;
const PRAISE = /(bagus|baik|jelas|inspiratif|sesuai|membantu|menarik|antusias|mantap|puas|bermanfaat|karakter|menyenangkan|interaktif|paham)/i;
const THEMES = [/waktu|durasi|jadwal|lama|sabtu|minggu|hari/i, /contoh|praktik|kasus|real/i, /materi|video|modul|konflik|conflict/i, /bergerak|interaktif|peserta|jarak|diskusi/i, /offline|online|training|pelatihan/i];
const themeOf = (t) => { const i = THEMES.findIndex(re => re.test(t)); return i < 0 ? THEMES.length : i; };
const LEVEL = (v) => v >= 4.5 ? "sangat baik" : v >= 3.5 ? "baik" : v >= 2.5 ? "cukup" : "kurang dan perlu perbaikan";
const OPENER = {
  A: (v) => "Materi pelatihan dinilai " + LEVEL(v) + " oleh peserta.",
  B: (v) => "Fasilitator dinilai " + LEVEL(v) + " dalam menyampaikan materi.",
  C: (v) => "Penyelenggaraan kegiatan dinilai " + LEVEL(v) + " oleh peserta."
};

function tidySection(key){
  if (sectionFilled(key) && !confirm("Isi bagian ini akan diganti dengan hasil rapikan. Lanjutkan?")) return;
  const raw = [];
  uniqueComments(listFor(key)).forEach(c => c.text.split(/\s*;\s*/).forEach(p => p && raw.push({ text:p, n:c.n })));
  const clean = [];
  const seen = new Set();
  raw.sort((a,b) => b.n - a.n).forEach(c => {
    if (TRIVIAL.test(c.text.trim())) return;
    const t = tidyText(c.text);
    const k = norm(t).replace(/[.!?]$/, "");
    if (seen.has(k)) return;
    seen.add(k); clean.push(t);
  });

  if (key === "know") {
    // Jawaban sangat pendek (≤ 3 kata) digabung menjadi satu poin
    const lowerItem = (s) => s.replace(/[.!?]$/, "").split(" ").map(w => /^[A-Z]{2,}$/.test(w) ? w : w.toLowerCase()).join(" ");
    const short = clean.filter(t => t.split(" ").length <= 3).map(lowerItem);
    const long = clean.filter(t => t.split(" ").length >= 6).sort((a,b) => b.length - a.length);
    const MAX = short.length ? 3 : 4;   // jaga agar tetap muat 1 halaman
    const lines = long.slice(0, MAX);
    if (short.length) { const j = short.join(", "); lines.push("Konsep yang disebutkan peserta: " + j + "."); }
    state.summary.know = lines.join("\n");
    const skipped = clean.length - lines.length - short.length + (short.length ? 0 : 0);
    setEditorValues();
    render();
    $("stknow").textContent = "Dirapikan tanpa AI." + (skipped > 0 ? " " + skipped + " jawaban lain tidak dimasukkan; lihat daftar jawaban bila perlu." : "");
    return;
  } else {
    const r = state.data.results.find(x => x.key === key);
    const sugg = clean.filter(t => SUGGEST.test(t)).sort((a,b) => themeOf(a) - themeOf(b));
    const praise = clean.filter(t => !SUGGEST.test(t) && PRAISE.test(t) && t.split(" ").length >= 3).slice(0, 2);
    state.summary[key] = { pos: [OPENER[key](r.groupAvg)].concat(praise).join("\n"), imp: sugg.join("\n") };
  }
  setEditorValues();
  render();
  $("st" + key).textContent = "Dirapikan tanpa AI. Sunting kalimatnya bila perlu.";
}

/* =========================================================
   RINGKAS DENGAN AI – lewat endpoint server (Vercel) /api/summarize
   Prompt disusun di server; browser hanya mengirim data komentar.
   ========================================================= */
function aiPayload(mode){
  const d = state.data;
  const pack = (list) => uniqueComments(list).map(c => c.text + (c.n > 1 ? " (" + c.n + " orang)" : ""));
  return {
    mode,
    title: [$("fProgram").value.trim(), $("fJudul").value.trim()].filter(Boolean).join(" - "),
    averages: { A: round2(d.results[0].groupAvg), B: round2(d.results[1].groupAvg), C: round2(d.results[2].groupAvg) },
    comments: { A: pack(d.results[0].comments), B: pack(d.results[1].comments), C: pack(d.results[2].comments), know: pack(d.knowledge) }
  };
}
async function askAI(mode){
  let res;
  try {
    res = await fetch(CONFIG.aiEndpoint, { method:"POST", headers:{ "Content-Type":"application/json" }, body: JSON.stringify(aiPayload(mode)) });
  } catch (e) { throw new Error("tidak dapat menghubungi server"); }
  let data = {};
  try { data = await res.json(); } catch (e) {}
  if (!res.ok) throw new Error(data.error || ("server merespons status " + res.status));
  return data;
}
const toLines = (arr) => (Array.isArray(arr) ? arr : []).map(s => String(s).replace(/^\s*[-•*\d.]+\s*/, "").trim()).filter(Boolean).join("\n");

async function summarizeSection(key, btn){
  if (sectionFilled(key) && !confirm("Isi bagian ini akan diganti dengan rangkuman baru. Lanjutkan?")) return;
  const st = $("st" + key);
  btn.disabled = true;
  btn.innerHTML = '<span class="spin" aria-hidden="true"></span> Meringkas…';
  st.textContent = "";
  try {
    const json = await askAI(key);
    if (key === "know") state.summary.know = toLines(json.wawasan);
    else state.summary[key] = { pos: toLines(json.positif), imp: toLines(json.perbaikan) };
    setEditorValues();
    render();
    st.textContent = "Rangkuman AI diperbarui.";
  } catch (err) {
    console.error(err);
    st.textContent = "Gagal meringkas: " + (err.message || err) + ". Gunakan Rapikan.";
  } finally {
    btn.disabled = false;
    btn.textContent = "Ringkas dengan AI";
  }
}

async function runAll(){
  if (!state.data) return;
  const any = ["A","B","C","know"].some(sectionFilled);
  if (any && !confirm("Isi semua rangkuman akan diganti. Lanjutkan?")) return;
  const btn = $("btnAI");
  btn.disabled = true;
  $("aiNotice").innerHTML = "";
  if (!state.aiAvailable) {
    ["A","B","C","know"].forEach(k => { state.summary[k] = k === "know" ? "" : { pos:"", imp:"" }; });
    ["A","B","C","know"].forEach(k => tidySection(k));
    $("aiStatus").textContent = "Semua bagian dirapikan tanpa AI. Sunting sebelum mengunduh.";
    btn.disabled = false;
    return;
  }
  btn.innerHTML = '<span class="spin" aria-hidden="true"></span> Menyusun rangkuman…';
  $("aiStatus").textContent = "Biasanya 10–20 detik.";
  try {
    const json = await askAI("all");
    state.summary = {
      A:{ pos: toLines(json.materi?.positif), imp: toLines(json.materi?.perbaikan) },
      B:{ pos: toLines(json.fasilitator?.positif), imp: toLines(json.fasilitator?.perbaikan) },
      C:{ pos: toLines(json.penyelenggaraan?.positif), imp: toLines(json.penyelenggaraan?.perbaikan) },
      know: toLines(json.wawasan)
    };
    setEditorValues();
    render();
    $("aiStatus").textContent = "Rangkuman AI siap. Periksa dan sesuaikan sebelum mengunduh.";
  } catch (err) {
    console.error(err);
    $("aiStatus").textContent = "";
    $("aiNotice").innerHTML = '<div class="notice err">Rangkuman AI gagal: ' + esc(err.message || err) +
      '. Gunakan tombol Rapikan pada tiap bagian.</div>';
  } finally {
    btn.disabled = false;
    btn.textContent = allLabel();
  }
}
$("btnAI").addEventListener("click", runAll);
const allLabel = () => state.aiAvailable ? "Ringkas semua dengan AI" : "Rapikan semua";

/* Cek apakah endpoint AI tersedia & sudah dikonfigurasi (token terpasang di server) */
async function detectAI(){
  state.aiAvailable = false;
  if (location.protocol !== "file:") {
    try {
      const res = await fetch(CONFIG.aiEndpoint, { method:"GET" });
      const j = res.ok ? await res.json() : {};
      state.aiAvailable = !!j.configured;
    } catch (e) {}
  }
  $("btnAI").textContent = allLabel();
  $("aiMode").textContent = state.aiAvailable
    ? "Ringkasan AI aktif. Tombol Rapikan tetap tersedia tanpa AI."
    : "Ringkasan AI tidak aktif di sini. Tombol Rapikan bekerja tanpa AI.";
  if (state.data) { const s = state.summary; buildEditors(); state.summary = s; setEditorValues(); }
}

/* =========================================================
   RENDER REPORT
   ========================================================= */
function bullets(text){
  return String(text || "").split("\n").map(s => s.replace(/^\s*[-•*]\s*/, "").trim()).filter(Boolean);
}
function textBlock(pos, imp){
  const p = bullets(pos), m = bullets(imp);
  let h = '<div class="r-text">';
  if (!p.length && !m.length) h += '<p class="r-placeholder">- (rangkuman belum diisi)</p>';
  p.forEach(s => h += '<p>- ' + esc(s) + '</p>');
  if (m.length) {
    h += '<p class="sublbl">Masukan perbaikan:</p>';
    m.forEach(s => h += '<p>- ' + esc(s) + '</p>');
  }
  return h + '</div>';
}
function chartHTML(r, withLegend){
  // Skala tetap 0–5 agar tinggi batang konsisten antar report.
  // Biru tua = nilai aktual, biru muda = sisa menuju nilai maksimal 5.
  const pct = (v) => Math.max(0, Math.min(5, v)) / 5 * 100;
  let grid = "", bars = "", cats = "";
  for (let v = 0; v <= 5; v++) {
    grid += '<div class="grid' + (v === 5 ? ' max' : '') + '" style="bottom:' + pct(v) + '%"><span>' + v.toFixed(1) + '</span></div>';
  }
  r.items.forEach(i => {
    const h = pct(i.avg);
    bars += '<div class="slot"><div class="track"><div class="fill' + (h < 14 ? ' low' : '') + '" style="height:' + h.toFixed(2) + '%"><span>' + fmt2(i.avg) + '</span></div></div></div>';
    cats += '<div>' + esc(i.label) + '</div>';
  });
  return '<div class="chart">' +
    '<div class="chart-title">' + esc(r.title) + '</div>' +
    '<div class="plot">' + grid +
      '<div class="bars' + (r.items.length <= 2 ? ' few' : '') + '">' + bars + '</div>' +
      '<div class="avgline" style="bottom:' + pct(r.groupAvg).toFixed(2) + '%"><span>' + fmt2(r.groupAvg) + '</span></div>' +
    '</div>' +
    '<div class="cats">' + cats + '</div>' +
    (withLegend ? '<div class="legend"><span><i style="background:#0B2160"></i>Nilai aktual</span><span><i style="background:#C9D6EE"></i>Sisa menuju 5.00</span></div>' : '') +
  '</div>';
}

function render(){
  const page = $("page");
  const d = state.data;
  const val = (id, ph) => { const v = $(id).value.trim(); return v ? esc(v) : '<span class="r-placeholder">' + ph + '</span>'; };

  let html = '<div class="r-body"><div class="r-content" id="rContent">' +
    '<div class="r-logo"><img src="' + CONFIG.logo + '" alt="MDS Retailing"></div>' +
    '<div class="r-title"><div>EVALUASI PELATIHAN</div></div>' +
    '<table class="r-info">' +
      '<tr><td>Program</td><td>: ' + val("fProgram","…") + '</td></tr>' +
      '<tr><td>Materi</td><td>: ' + val("fJudul","…") + '</td></tr>' +
      '<tr><td>Hari, Tanggal</td><td>: ' + val("fTanggal","…") + '</td></tr>' +
      '<tr><td>Durasi</td><td>: ' + val("fDurasi","…") + '</td></tr>' +
      '<tr><td>Fasilitator</td><td>: ' + val("fTrainer","…") + '</td></tr>' +
      '<tr><td>Training Coordinator</td><td>: ' + val("fCoord","…") + '</td></tr>' +
    '</table>' +
    '<div class="r-legend"><div class="lbl">Arti Nilai Yang Diperoleh:</div>' +
      '<div class="band"><span>1 = Kurang Sekali</span><span>2 = Kurang</span><span>3 = Cukup</span><span>4 = Baik</span><span>5 = Baik Sekali</span></div></div>' +
    '<div class="r-h">ASPEK YANG DINILAI</div>';

  if (!d) {
    html += '<div class="r-empty" style="height:520px">Grafik dan rangkuman akan muncul setelah data kuesioner diunggah.</div>';
  } else {
    d.results.forEach((r, idx) => {
      html += chartHTML(r, idx === d.results.length - 1) +
        '<div class="r-avg">Nilai Rata-rata ' + r.key + ' = ' + fmt2(r.groupAvg) + '</div>' +
        textBlock(state.summary[r.key].pos, state.summary[r.key].imp);
    });
    const k = bullets(state.summary.know);
    html += '<div class="r-know-h">Pengetahuan/Wawasan yang Diperoleh peserta :</div><div class="r-text know">' +
      (k.length ? k.map(s => '<p>- ' + esc(s) + '</p>').join("") : '<p class="r-placeholder">- (rangkuman belum diisi)</p>') + '</div>';
  }

  html += '</div></div>' +
    '<div class="r-foot"><b>HR-Learning &amp; Development Department</b></div>';

  page.innerHTML = html;
  fitToPage();
}

/* Kecilkan teks & grafik bertahap hingga konten muat 1 halaman */
function fitToPage(){
  const page = $("page"), content = $("rContent"), body = page.querySelector(".r-body");
  // Tahap 1: kecilkan tinggi grafik dulu (hingga 60%). Tahap 2: baru kecilkan teks (hingga 78%).
  let kc = 1, k = 1;
  page.style.setProperty("--kc", kc);
  page.style.setProperty("--k", k);
  while (content.scrollHeight > body.clientHeight && kc > 0.6) {
    kc = Math.round((kc - 0.04) * 100) / 100;
    page.style.setProperty("--kc", kc);
  }
  while (content.scrollHeight > body.clientHeight && k > 0.78) {
    k = Math.round((k - 0.02) * 100) / 100;
    page.style.setProperty("--k", k);
  }
  const over = content.scrollHeight > body.clientHeight;
  const st = $("fitStatus");
  st.classList.toggle("over", over);
  st.textContent = over
    ? "Konten melebihi 1 halaman — ringkas beberapa poin."
    : (k < 1 ? "Muat 1 halaman (ukuran teks disesuaikan " + Math.round(k*100) + "%)"
       : kc < 1 ? "Muat 1 halaman (tinggi grafik disesuaikan)" : "Muat 1 halaman A4");
  return !over;
}

/* =========================================================
   SKALA PRATINJAU
   ========================================================= */
function scalePreview(){
  const frame = $("sheetFrame"), scaler = $("sheetScaler");
  const s = Math.min(1, frame.clientWidth / 794);
  scaler.style.transform = "scale(" + s + ")";
  frame.style.height = (1123 * s) + "px";
}
new ResizeObserver(scalePreview).observe($("sheetFrame"));

/* =========================================================
   EKSPOR PDF
   ========================================================= */
$("btnPDF").addEventListener("click", async () => {
  const btn = $("btnPDF");
  if (!fitToPage() && !confirm("Konten masih melebihi 1 halaman dan bagian bawah akan terpotong. Tetap unduh?")) return;
  if (state.data) {
    const empty = [];
    ["A","B","C"].forEach(k => { if (!bullets(state.summary[k].pos).length && !bullets(state.summary[k].imp).length) empty.push(SECTIONS.find(s => s.key === k).name); });
    if (!bullets(state.summary.know).length) empty.push("Pengetahuan/Wawasan");
    if (empty.length && !confirm("Rangkuman " + empty.join(", ") + " belum diisi dan akan dikosongkan di PDF. Tetap unduh?")) return;
  }
  if (typeof html2canvas === "undefined" || !window.jspdf) { alert("Pustaka PDF gagal dimuat. Periksa koneksi internet lalu muat ulang halaman."); return; }
  btn.disabled = true;
  btn.innerHTML = '<span class="spin" aria-hidden="true"></span> Menyiapkan PDF…';
  let holder;
  try {
    await document.fonts.ready;
    // Render salinan halaman tanpa skala pratinjau supaya hasilnya tajam & ukuran asli
    holder = document.createElement("div");
    holder.style.cssText = "position:absolute;left:-10000px;top:0;width:794px;";
    const clone = $("page").cloneNode(true);
    clone.removeAttribute("id");
    clone.querySelectorAll("[id]").forEach(el => el.removeAttribute("id"));
    clone.querySelectorAll(".r-text .r-placeholder").forEach(el => el.remove());
    holder.appendChild(clone);
    document.body.appendChild(holder);

    const canvas = await html2canvas(clone, { scale: 3, backgroundColor: "#ffffff", useCORS: true, logging: false, width: 794, height: 1123, windowWidth: 1400 });
    const img = canvas.toDataURL("image/jpeg", 0.95);
    const pdf = new window.jspdf.jsPDF({ unit:"mm", format:"a4", orientation:"portrait", compress:true });
    pdf.addImage(img, "JPEG", 0, 0, 210, 297);
    const judul = ([$("fProgram").value.trim(), $("fJudul").value.trim()].filter(Boolean).join(" ") || "Pelatihan").replace(/[\\/:*?"<>|]+/g, "").replace(/\s+/g, "_");
    pdf.save("Evaluasi_" + judul + ".pdf");
  } catch (err) {
    console.error(err);
    alert("PDF gagal dibuat: " + (err.message || err));
  } finally {
    if (holder) holder.remove();
    btn.disabled = !state.data;
    btn.textContent = "Unduh PDF";
  }
});

render();
scalePreview();
detectAI();
</script>
